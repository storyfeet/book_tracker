<h2>Add Book</h2>
<form (submit)="onSubmit()">
    <span>Title: </span><input name="Title" type="text" [(ngModel)]="book.Title" /><br>
    <span>Notes: </span><input name="Notes" type="text" [(ngModel)]="book.Notes"/><br>
    <span>ISBN: </span><input name="ISBN" type="text" [(ngModel)]="book.ISBN" />
    <input type="submit" value="Add Book">
</form>
