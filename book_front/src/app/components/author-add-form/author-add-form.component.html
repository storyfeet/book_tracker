<h2>Add Book</h2>
<form (submit)="onSubmit()">
    <span>Full Name: </span><input name="FullName" type="text" [(ngModel)]="book.FullName" /><br>
    <span>Notes: </span><input name="Notes" type="text" [(ngModel)]="book.Notes"/><br>
    <span>Genres: </span><input name="Genres" type="text" [(ngModel)]="book.Genres" />
    <input type="submit" value="Add Book">
</form>
