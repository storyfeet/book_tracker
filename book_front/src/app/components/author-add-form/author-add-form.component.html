<h2>Add Author</h2>
<form (submit)="onSubmit()">
    <span>Full Name: </span><input name="FullName" type="text" [(ngModel)]="author.FullName" /><br>
    <span>Notes: </span><input name="Notes" type="text" [(ngModel)]="author.Notes"/><br>
    <span>Genres: </span><input name="Genres" type="text" [(ngModel)]="author.Genres" />
    <input type="submit" value="Add Author">
</form>
