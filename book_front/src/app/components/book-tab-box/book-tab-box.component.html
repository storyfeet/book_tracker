  <div class="tab-box">
    <button (click)="select('VIEW_BOOKS')">Books</button>
    <button (click)="select('ADD_BOOK')">Add Book</button>
    <button (click)="select('ADD_AUTHOR')">Add Author</button>
  </div>
  @switch (mode) {
    @case ('VIEW_BOOKS'){
        <app-book-list/>
    }
    @case ('ADD_BOOK'){
        <app-book-add-form/>
    }
    @case ('ADD_AUTHOR'){
      <app-author-add-form/>
    }
    @default(){
        <span>TODO: {{mode}}</span>
    }
  }
